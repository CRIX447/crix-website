<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CRIX CHAT</title>
<link rel="icon" href="/img/newfavicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="/filter.js?v=2026081611"></script>
<style>
@font-face{font-family:'CRIX Pixel';src:url('/img/font.otf') format('opentype');font-display:swap}
:root{
  --red:#FF4655; --orange:#FF6B35; --green:#00CC7A; --blue:#27A9F5;
  --bg:#0A0A0F; --bg2:#101018; --bg3:#16161F; --line:rgba(255,255,255,.08);
  --text:#EDEDED; --dim:#9A9A9A;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);
  font-family:'CRIX Pixel','Fredoka One',system-ui,sans-serif;font-size:14px;overflow:hidden}
button,input,textarea{font-family:inherit}

/* ---------- AUTH ---------- */
#gate{height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background-image:linear-gradient(rgba(255,70,85,.04) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,70,85,.04) 1px,transparent 1px);
  background-size:48px 48px}
.gate-card{background:var(--bg2);border:2px solid var(--red);border-bottom:5px solid rgba(150,20,35,.7);
  border-radius:20px;padding:34px 30px;max-width:380px;width:100%;box-shadow:5px 5px 0 rgba(0,0,0,.6)}
.gate-logo{font-size:24px;font-weight:bold;letter-spacing:2px;text-align:center;margin-bottom:4px;
  background:linear-gradient(135deg,var(--red),var(--orange));-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text}
.gate-sub{text-align:center;color:var(--dim);font-size:11px;margin-bottom:22px}
.field{width:100%;background:#0b0b12;border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:11px 14px;font-size:13px;margin-bottom:9px}
.field:focus{outline:none;border-color:var(--orange)}
.btn{border:none;border-radius:10px;padding:11px 18px;font-size:13px;font-weight:bold;
  cursor:pointer;width:100%;letter-spacing:.5px}
.btn-primary{background:linear-gradient(135deg,var(--red),var(--orange));color:#fff;
  border:2px solid rgba(255,255,255,.15);border-bottom:4px solid rgba(0,0,0,.4)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-google{background:#fff;color:#1a1a1a;margin-bottom:10px;display:flex;align-items:center;
  justify-content:center;gap:9px}
.btn-google:hover{background:#f0f0f0}
.divider{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:10px;margin:14px 0}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}
.switch{text-align:center;color:var(--blue);font-size:11px;margin-top:14px;cursor:pointer}
.switch:hover{text-decoration:underline}
.err{font-size:11px;text-align:center;min-height:16px;margin-top:8px;line-height:1.5;color:var(--red)}
.back{display:block;text-align:center;color:var(--dim);font-size:10px;margin-top:16px;text-decoration:none}
.back:hover{color:var(--text)}

/* ---------- SHELL ---------- */
#app{display:none;height:100vh;grid-template-columns:200px 1fr 190px;grid-template-rows:48px 1fr}
@media(max-width:820px){
  #app{grid-template-columns:1fr;grid-template-rows:48px 1fr}
  #channels,#members{display:none}
  #channels.open,#members.open{display:flex;position:fixed;top:48px;bottom:0;width:230px;z-index:60}
  #members.open{right:0}
}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:#08080d;border-bottom:2px solid rgba(255,70,85,.35)}
.brand{font-size:15px;font-weight:bold;letter-spacing:1.5px;
  background:linear-gradient(135deg,var(--red),var(--orange));-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text}
.chan-title{color:var(--dim);font-size:12px}
.chan-title strong{color:var(--text)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{background:none;border:1px solid var(--line);color:var(--dim);width:30px;height:30px;
  border-radius:8px;cursor:pointer;font-size:13px;align-items:center;justify-content:center;display:none}
.icon-btn.always{display:flex}
@media(max-width:820px){.icon-btn{display:flex}}
.me{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--dim)}

/* ---------- CHANNELS ---------- */
#channels{background:var(--bg2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow-y:auto;padding:10px 8px}
.sec{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;padding:8px 8px 5px}
.chan{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:8px;
  cursor:pointer;color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden}
.chan:hover{background:rgba(255,255,255,.05);color:var(--text)}
.chan.active{background:rgba(255,70,85,.15);color:var(--red)}
.chan .hash{opacity:.6}
.chan-add{margin-top:auto;font-size:11px;color:var(--dim);background:none;
  border:1px dashed var(--line);border-radius:8px;padding:8px;cursor:pointer;width:100%}
.chan-add:hover{color:var(--text);border-color:rgba(255,255,255,.2)}

/* ---------- MESSAGES ---------- */
#main{display:flex;flex-direction:column;min-width:0;background:var(--bg)}
#messages{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.msg{display:flex;gap:10px;padding:5px 8px;border-radius:8px;position:relative}
.msg:hover{background:rgba(255,255,255,.025)}
.msg.grouped{padding-top:1px}
.msg.grouped .msg-av{visibility:hidden;height:0;margin:0}
.msg.grouped .msg-head{display:none}
.msg.mention{background:rgba(255,70,85,.08);border-left:2px solid var(--red)}
.av{border-radius:50%;object-fit:cover;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;font-weight:bold;color:#fff}
.msg-av{width:34px;height:34px;font-size:14px}
.sm-av{width:26px;height:26px;font-size:11px}
.msg-body{flex:1;min-width:0}
.msg-head{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin-bottom:1px}
.msg-name{font-size:13px;font-weight:bold;color:#fff}
.msg-time{font-size:9px;color:var(--dim)}
.msg-text{font-size:13px;line-height:1.55;color:#DDD;word-wrap:break-word;
  overflow-wrap:anywhere;white-space:pre-wrap}
.msg-text a{color:var(--blue)}
.mention-chip{background:rgba(255,70,85,.25);color:#FF8A94;padding:0 4px;border-radius:4px;font-weight:bold}
.tag{font-size:9px;font-weight:bold;padding:1px 6px;border-radius:8px}
.msg-del{position:absolute;top:4px;right:6px;background:rgba(0,0,0,.65);border:1px solid var(--line);
  color:var(--red);font-size:10px;padding:2px 7px;border-radius:6px;cursor:pointer;display:none}
.msg:hover .msg-del{display:block}
.day{text-align:center;color:var(--dim);font-size:10px;margin:14px 0 6px;position:relative}
.day::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:var(--line);z-index:0}
.day span{background:var(--bg);padding:0 10px;position:relative;z-index:1}
.empty{color:var(--dim);font-size:12px;text-align:center;padding:40px 20px;line-height:1.8}

/* ---------- COMPOSER ---------- */
#composer{padding:10px 16px 14px;border-top:1px solid var(--line);position:relative}
.compose-row{display:flex;gap:8px;align-items:flex-end;background:var(--bg3);
  border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.compose-row:focus-within{border-color:var(--orange)}
#input{flex:1;background:none;border:none;color:var(--text);font-size:13px;resize:none;
  max-height:120px;line-height:1.5;outline:none}
.send{background:var(--red);border:none;color:#fff;border-radius:8px;padding:7px 14px;
  font-size:12px;font-weight:bold;cursor:pointer}
.hint{font-size:9px;color:var(--dim);margin-top:5px}
.mention-pop{position:absolute;bottom:100%;left:16px;right:16px;background:var(--bg3);
  border:1px solid var(--orange);border-radius:10px;max-height:150px;overflow-y:auto;
  display:none;margin-bottom:6px;z-index:20}
.mention-pop.open{display:block}
.mention-opt{padding:7px 11px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:8px}
.mention-opt:hover,.mention-opt.sel{background:rgba(255,107,53,.15)}

/* ---------- MEMBERS ---------- */
#members{background:var(--bg2);border-left:1px solid var(--line);overflow-y:auto;
  display:flex;flex-direction:column;padding:10px 8px}
.member{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;font-size:12px}
.member:hover{background:rgba(255,255,255,.04)}
.member-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.offline{opacity:.45}
</style>
</head>
<body>

<!-- ================= AUTH ================= -->
<div id="gate">
  <div class="gate-card">
    <div class="gate-logo">CRIX CHAT</div>
    <div class="gate-sub">Talk with the community</div>

    <button class="btn btn-google" id="googleBtn">
      <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#4285F4" d="M45 24c0-1.6-.1-2.7-.4-4H24v7.5h12c-.2 2-1.5 5-4.4 7l6.7 5.2C42.2 36 45 30.6 45 24z"/><path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.3l-6.7-5.2c-1.9 1.3-4.4 2.2-7.8 2.2-6 0-11-4-12.8-9.5l-7 5.4C7.8 40.9 15.3 46 24 46z"/><path fill="#FBBC05" d="M11.2 28.2c-.5-1.4-.7-2.8-.7-4.2s.3-2.9.7-4.2l-7-5.4C2.8 17.3 2 20.5 2 24s.8 6.7 2.2 9.6l7-5.4z"/><path fill="#EA4335" d="M24 10.7c3.3 0 6.2 1.1 8.5 3.3l6-6C34.9 4.6 29.9 2 24 2 15.3 2 7.8 7.1 4.2 14.4l7 5.4C13 14.7 18 10.7 24 10.7z"/></svg>
      Continue with Google
    </button>

    <div class="divider">or</div>

    <input class="field" type="email" id="email" placeholder="Email" autocomplete="email">
    <input class="field" type="password" id="password" placeholder="Password" autocomplete="current-password">
    <input class="field" type="text" id="username" placeholder="Display name" style="display:none">
    <button class="btn btn-primary" id="submitBtn">Sign in</button>

    <div class="switch" id="switchMode">New here? Create an account</div>
    <div class="err" id="err"></div>
    <a class="back" href="/">← Back to the main site</a>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div class="topbar">
    <button class="icon-btn" id="chanToggle">☰</button>
    <span class="brand">CRIX CHAT</span>
    <span class="chan-title">#<strong id="curChan">general</strong></span>
    <div class="topbar-right">
      <button class="icon-btn" id="memToggle">👥</button>
      <div class="me" id="meBox"></div>
      <button class="icon-btn always" id="signOut" title="Sign out">⏻</button>
    </div>
  </div>

  <div id="channels">
    <div class="sec">Channels</div>
    <div id="chanList"></div>
    <button class="chan-add" id="addChan" style="display:none">+ New channel</button>
  </div>

  <div id="main">
    <div id="messages"><div class="empty">Loading…</div></div>
    <div id="composer">
      <div class="mention-pop" id="mentionPop"></div>
      <div class="compose-row">
        <textarea id="input" rows="1" placeholder="Message #general" maxlength="1000"></textarea>
        <button class="send" id="sendBtn">Send</button>
      </div>
      <div class="hint">Enter to send · Shift+Enter for a new line · @ to mention</div>
    </div>
  </div>

  <div id="members">
    <div class="sec" id="memCount">Members</div>
    <div id="memList"></div>
  </div>
</div>

<script>
/* ============================================================
   CRIX CHAT
   Shares the Firebase project, roles and account system with the
   game, so sign-ins and [OWNER]/[MOD] tags carry across.
   ============================================================ */
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement('div'); d.textContent = String(s ?? ''); return d.innerHTML; };

const ROLE_TAGS = {
  OWNER: { label:'OWNER', colour:'#FF0000', order:1 },
  MOD:   { label:'MOD',   colour:'#00ffd5', order:2 }
};
const DEFAULT_CHANNELS = [
  { id:'general',     name:'general',     desc:'Anything goes',            order:0 },
  { id:'flappy-crix', name:'flappy-crix', desc:'Talk about the game',      order:1 },
  { id:'clips',       name:'clips',       desc:'Share your best moments',  order:2 },
  { id:'help',        name:'help',        desc:'Stuck? Ask here',          order:3 }
];

let auth, db, me = null, myRoles = [], isSignUp = false;
let channels = [], curChannel = 'general';
let unsubMsgs = null, unsubPresence = null, members = [];

/* ---------- boot ---------- */
(async function init() {
  let cfg;
  try {
    cfg = await (await fetch('/api.json?cb=' + Date.now())).json();
  } catch (e) { return fail('Could not load api.json — is it deployed?'); }

  try {
    firebase.initializeApp(cfg.firebase);
    auth = firebase.auth();
    db   = firebase.firestore();
  } catch (e) { return fail('Firebase failed to start: ' + e.message); }

  auth.onAuthStateChanged(async user => {
    me = user;
    if (!user) {
      $('gate').style.display = 'flex';
      $('app').style.display  = 'none';
      return;
    }
    $('gate').style.display = 'none';
    $('app').style.display  = 'grid';
    await loadMyRoles();
    renderMe();
    await ensureChannels();
    openChannel(localStorage.getItem('crixchat_channel') || 'general');
    watchMembers();
    heartbeat();
    setInterval(heartbeat, 30000);
  });

  auth.getRedirectResult().catch(e => { if (e.code) fail(authMsg(e)); });
})();

function fail(msg) { $('err').textContent = msg; }

/* ---------- auth ---------- */
$('googleBtn').onclick = async () => {
  const p = new firebase.auth.GoogleAuthProvider();
  p.setCustomParameters({ prompt: 'select_account' });
  fail('');
  try { await auth.signInWithPopup(p); }
  catch (e) {
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/cancelled-popup-request') {
      return auth.signInWithRedirect(p);      // popup blocked, use redirect
    }
    if (e.code !== 'auth/popup-closed-by-user') fail(authMsg(e));
  }
};

$('switchMode').onclick = () => {
  isSignUp = !isSignUp;
  $('username').style.display = isSignUp ? 'block' : 'none';
  $('submitBtn').textContent  = isSignUp ? 'Create account' : 'Sign in';
  $('switchMode').textContent = isSignUp
    ? 'Already have an account? Sign in' : 'New here? Create an account';
  fail('');
};

$('submitBtn').onclick = async () => {
  const email = $('email').value.trim(), pass = $('password').value;
  const name  = $('username').value.trim();
  if (!email || !pass) return fail('Enter an email and password.');
  if (isSignUp && !name) return fail('Choose a display name.');
  if (isSignUp && pass.length < 6) return fail('Password must be at least 6 characters.');

  $('submitBtn').disabled = true;
  $('submitBtn').textContent = isSignUp ? 'Creating…' : 'Signing in…';
  fail('');
  try {
    if (isSignUp) {
      const cred = await auth.createUserWithEmailAndPassword(email, pass);
      await cred.user.updateProfile({ displayName: name });
      cred.user.sendEmailVerification().catch(() => {});
    } else {
      await auth.signInWithEmailAndPassword(email, pass);
    }
  } catch (e) { fail(authMsg(e)); }
  finally {
    $('submitBtn').disabled = false;
    $('submitBtn').textContent = isSignUp ? 'Create account' : 'Sign in';
  }
};

['email','password','username'].forEach(id =>
  $(id).addEventListener('keypress', e => { if (e.key === 'Enter') $('submitBtn').click(); }));

function authMsg(e) {
  return ({
    'auth/email-already-in-use':'That email already has an account — try signing in.',
    'auth/invalid-email':'That email address is not valid.',
    'auth/wrong-password':'Incorrect password.',
    'auth/user-not-found':'No account with that email.',
    'auth/invalid-credential':'Incorrect email or password.',
    'auth/weak-password':'Password must be at least 6 characters.',
    'auth/too-many-requests':'Too many attempts — wait a few minutes.',
    'auth/unauthorized-domain':'This domain is not authorised in Firebase → Authentication → Settings.',
    'auth/operation-not-allowed':'That sign-in method is not enabled in Firebase.'
  })[e.code] || e.message;
}

$('signOut').onclick = () => {
  if (unsubMsgs) unsubMsgs();
  if (unsubPresence) unsubPresence();
  auth.signOut();
};

/* ---------- roles ---------- */
async function loadMyRoles() {
  myRoles = [];
  // Owners come from the same collection the game and console use
  try {
    const o = await db.collection('owners').doc(me.uid).get();
    if (o.exists) myRoles.push('OWNER');
  } catch (e) {}
  try {
    const r = await db.collection('chatRoles').doc(me.uid).get();
    if (r.exists) (r.data().roles || []).forEach(x => { if (!myRoles.includes(x)) myRoles.push(x); });
  } catch (e) {}
  if (myRoles.includes('OWNER')) $('addChan').style.display = 'block';
}

function tagHtml(roles) {
  return (roles || [])
    .filter(r => ROLE_TAGS[r])
    .sort((a, b) => ROLE_TAGS[a].order - ROLE_TAGS[b].order)
    .map(r => `<span class="tag" style="color:${ROLE_TAGS[r].colour};background:${ROLE_TAGS[r].colour}22">${ROLE_TAGS[r].label}</span>`)
    .join('');
}

/* Avatars are built as elements with a data-fallback, not an inline onerror,
   so a name containing an apostrophe can't break the attribute. */
function avatarHtml(url, name, cls) {
  const initial = esc((name || '?').charAt(0).toUpperCase());
  return url
    ? `<img class="av ${cls}" src="${esc(url)}" alt="" data-fallback="${initial}">`
    : `<div class="av ${cls}" style="background:#FF4655">${initial}</div>`;
}
function wireAvatars(root) {
  (root || document).querySelectorAll('img.av[data-fallback]').forEach(img => {
    if (img.dataset.wired) return;
    img.dataset.wired = '1';
    img.addEventListener('error', function () {
      const d = document.createElement('div');
      d.className = this.className;
      d.style.background = '#FF4655';
      d.textContent = this.dataset.fallback || '?';
      this.replaceWith(d);
    });
  });
}

function renderMe() {
  $('meBox').innerHTML = avatarHtml(me.photoURL, me.displayName || me.email, 'sm-av') +
    `<span>${esc((me.displayName || me.email || 'You').slice(0, 14))}</span>`;
  wireAvatars($('meBox'));
}

/* ---------- channels ---------- */
async function ensureChannels() {
  try {
    const snap = await db.collection('chatChannels').orderBy('order').get();
    if (snap.empty) {
      await Promise.all(DEFAULT_CHANNELS.map(c =>
        db.collection('chatChannels').doc(c.id).set(c).catch(() => {})));
      channels = DEFAULT_CHANNELS.slice();
    } else {
      channels = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }
  } catch (e) {
    console.warn('[Chat] channel load failed, using defaults:', e.message);
    channels = DEFAULT_CHANNELS.slice();
  }
  renderChannels();
}

function renderChannels() {
  $('chanList').innerHTML = channels.map(c =>
    `<div class="chan ${c.id === curChannel ? 'active' : ''}" data-id="${esc(c.id)}" title="${esc(c.desc || '')}">
       <span class="hash">#</span><span>${esc(c.name)}</span>
     </div>`).join('');
  $('chanList').querySelectorAll('.chan').forEach(el =>
    el.onclick = () => { openChannel(el.dataset.id); $('channels').classList.remove('open'); });
}

$('addChan').onclick = async () => {
  const raw = prompt('Channel name (lowercase, no spaces):');
  if (!raw) return;
  const id = raw.toLowerCase().replace(/[^a-z0-9-]/g, '-').replace(/-+/g, '-').slice(0, 24);
  if (!id) return;
  try {
    await db.collection('chatChannels').doc(id).set({
      id, name: id, desc: '', order: channels.length
    });
    await ensureChannels();
    openChannel(id);
  } catch (e) { alert('Could not create it: ' + e.message); }
};

function openChannel(id) {
  if (!channels.find(c => c.id === id)) id = channels[0] ? channels[0].id : 'general';
  curChannel = id;
  try { localStorage.setItem('crixchat_channel', id); } catch (e) {}
  $('curChan').textContent = id;
  $('input').placeholder = 'Message #' + id;
  renderChannels();
  watchMessages();
}

/* ---------- messages ---------- */
function watchMessages() {
  if (unsubMsgs) unsubMsgs();
  $('messages').innerHTML = '<div class="empty">Loading…</div>';

  unsubMsgs = db.collection('chatMessages')
    .where('channel', '==', curChannel)
    .orderBy('at', 'desc')
    .limit(100)
    .onSnapshot(
      snap => renderMessages(snap.docs.map(d => ({ id: d.id, ...d.data() })).reverse()),
      err => {
        const needsIndex = /index/i.test(err.message);
        $('messages').innerHTML =
          `<div class="empty" style="color:#FF4655">Could not load messages.<br>
           <span style="font-size:10px;color:#9A9A9A">${esc(err.message)}</span>
           ${needsIndex ? '<br><span style="font-size:10px">Firestore needs an index — open the link in the browser console to create it.</span>' : ''}</div>`;
      }
    );
}

function renderMessages(msgs) {
  const box = $('messages');
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;

  if (!msgs.length) {
    box.innerHTML = `<div class="empty">Nothing here yet.<br>Say something in #${esc(curChannel)}.</div>`;
    return;
  }

  const myName = (me.displayName || me.email || '').toLowerCase();
  let html = '', prevUid = null, prevDay = null;

  msgs.forEach(m => {
    const when = m.at && m.at.toDate ? m.at.toDate() : new Date();
    const day  = when.toDateString();
    if (day !== prevDay) {
      html += `<div class="day"><span>${day === new Date().toDateString() ? 'Today' : esc(day)}</span></div>`;
      prevDay = day; prevUid = null;
    }
    const grouped = m.uid === prevUid;      // consecutive messages collapse
    prevUid = m.uid;

    const mentioned = myName &&
      new RegExp('@' + myName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, ''), 'i')
        .test(m.text || '');
    const canDelete = m.uid === me.uid || myRoles.includes('OWNER') || myRoles.includes('MOD');

    html += `<div class="msg${grouped ? ' grouped' : ''}${mentioned ? ' mention' : ''}">
      ${avatarHtml(m.photo, m.name, 'msg-av')}
      <div class="msg-body">
        <div class="msg-head">
          <span class="msg-name">${esc(m.name || 'Player')}</span>
          ${tagHtml(m.roles)}
          <span class="msg-time">${when.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' })}</span>
        </div>
        <div class="msg-text">${format(m.text || '')}</div>
      </div>
      ${canDelete ? `<button class="msg-del" data-del="${esc(m.id)}">delete</button>` : ''}
    </div>`;
  });

  box.innerHTML = html;
  wireAvatars(box);
  box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => deleteMsg(b.dataset.del));
  if (atBottom) box.scrollTop = box.scrollHeight;
}

/* Escape FIRST, then add links and mention chips — never the other way round,
   or a message could inject markup. */
function format(text) {
  let s = esc(text);
  s = s.replace(/(https?:\/\/[^\s<]+)/g,
    u => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
  s = s.replace(/@([\w-]{2,25})/g, (full, n) => {
    const hit = members.find(m => (m.name || '').toLowerCase().replace(/\s+/g, '') === n.toLowerCase());
    return hit ? `<span class="mention-chip">@${esc(hit.name)}</span>` : full;
  });
  return s;
}

async function sendMessage() {
  const input = $('input');
  let text = input.value.trim();
  if (!text) return;
  if (typeof ChatFilter !== 'undefined') text = ChatFilter.clean(text);

  input.value = '';
  input.style.height = 'auto';
  try {
    await db.collection('chatMessages').add({
      channel: curChannel,
      uid: me.uid,
      name: me.displayName || (me.email ? me.email.split('@')[0] : 'Player'),
      photo: me.photoURL || null,
      roles: myRoles,
      text: text.slice(0, 1000),
      at: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch (e) {
    input.value = text;               // don't lose what they typed
    alert('Could not send: ' + e.message);
  }
}

async function deleteMsg(id) {
  if (!confirm('Delete this message?')) return;
  try { await db.collection('chatMessages').doc(id).delete(); }
  catch (e) { alert('Could not delete: ' + e.message); }
}

$('sendBtn').onclick = sendMessage;
$('input').addEventListener('input', function () {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  updateMentionPop(this);
});

/* ---------- @mentions ---------- */
let mentionSel = 0, mentionMatches = [];

function updateMentionPop(input) {
  const pop = $('mentionPop');
  const upto = input.value.slice(0, input.selectionStart);
  const m = upto.match(/@([\w-]*)$/);
  if (!m) return pop.classList.remove('open');
  const q = m[1].toLowerCase();
  mentionMatches = members
    .filter(x => (x.name || '').toLowerCase().replace(/\s+/g, '').startsWith(q))
    .slice(0, 6);
  if (!mentionMatches.length) return pop.classList.remove('open');
  mentionSel = 0;
  pop.innerHTML = mentionMatches.map((x, i) =>
    `<div class="mention-opt${i === 0 ? ' sel' : ''}" data-n="${esc(x.name)}">
       ${avatarHtml(x.photo, x.name, 'sm-av')}<span>${esc(x.name)}</span></div>`).join('');
  pop.classList.add('open');
  wireAvatars(pop);
  pop.querySelectorAll('.mention-opt').forEach(o =>
    o.addEventListener('mousedown', ev => { ev.preventDefault(); pickMention(o.dataset.n); }));
}

function pickMention(name) {
  const input = $('input');
  const start = input.selectionStart;
  input.value = input.value.slice(0, start).replace(/@([\w-]*)$/, '@' + name.replace(/\s+/g, '') + ' ')
              + input.value.slice(start);
  input.focus();
  $('mentionPop').classList.remove('open');
}

// Single keydown handler so mention navigation and sending don't fight
$('input').addEventListener('keydown', e => {
  const pop = $('mentionPop');
  if (pop.classList.contains('open')) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      mentionSel = (mentionSel + (e.key === 'ArrowDown' ? 1 : -1) + mentionMatches.length) % mentionMatches.length;
      pop.querySelectorAll('.mention-opt').forEach((o, i) => o.classList.toggle('sel', i === mentionSel));
      return;
    }
    if (e.key === 'Tab' || e.key === 'Enter') {
      e.preventDefault(); pickMention(mentionMatches[mentionSel].name); return;
    }
    if (e.key === 'Escape') { pop.classList.remove('open'); return; }
  }
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
$('input').addEventListener('blur', () =>
  setTimeout(() => $('mentionPop').classList.remove('open'), 150));

/* ---------- members ---------- */
function heartbeat() {
  if (!me) return;
  db.collection('chatPresence').doc(me.uid).set({
    uid: me.uid,
    name: me.displayName || (me.email ? me.email.split('@')[0] : 'Player'),
    photo: me.photoURL || null,
    roles: myRoles,
    at: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true }).catch(() => {});
}

window.addEventListener('beforeunload', () => {
  if (me) db.collection('chatPresence').doc(me.uid)
            .set({ at: new Date(0) }, { merge: true }).catch(() => {});
});

function watchMembers() {
  if (unsubPresence) unsubPresence();
  unsubPresence = db.collection('chatPresence').onSnapshot(snap => {
    const now = Date.now();
    members = snap.docs.map(d => {
      const v = d.data();
      const age = v.at && v.at.toMillis ? now - v.at.toMillis() : 1e9;
      return Object.assign({}, v, { online: age < 90000 });   // stale = offline
    }).sort((a, b) => (b.online - a.online) || (a.name || '').localeCompare(b.name || ''));
    renderMembers();
  }, err => console.warn('[Chat] presence:', err.message));
}

function renderMembers() {
  const online = members.filter(m => m.online).length;
  $('memCount').textContent = `Members — ${online} online`;
  $('memList').innerHTML = members.map(m =>
    `<div class="member${m.online ? '' : ' offline'}">
       ${avatarHtml(m.photo, m.name, 'sm-av')}
       <span class="member-name">${esc(m.name || 'Player')}</span>
       ${tagHtml(m.roles)}
       <span class="dot" style="background:${m.online ? '#00CC7A' : '#555'}"></span>
     </div>`).join('') || '<div class="empty">Nobody here yet.</div>';
  wireAvatars($('memList'));
}

/* ---------- mobile panels ---------- */
$('chanToggle').onclick = () => $('channels').classList.toggle('open');
$('memToggle').onclick  = () => $('members').classList.toggle('open');
</script>
