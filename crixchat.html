<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CRIX CHAT</title>
<link rel="icon" href="/img/newfavicon.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="/filter.js?v=2026081613"></script>

<style>aa
@keyframes spin{to{transform:rotate(360deg)}}
@font-face{font-family:'CRIX Pixel';src:url('/img/font.otf') format('opentype');font-display:swap}
:root{--red:#FF4655;--orange:#FF6B35;--green:#00CC7A;--blue:#27A9F5;
  --bg:#0A0A0F;--panel:#101018;--panel2:#15151F;--line:rgba(255,255,255,.07);--dim:#9A9A9A}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--bg);color:#EDEDED;font-family:'CRIX Pixel','Fredoka One',system-ui,sans-serif;
  font-size:14px;overflow:hidden}
button,input,textarea{font-family:inherit}

/* GATE */
#gate{height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--panel);border:2px solid var(--red);border-bottom:5px solid rgba(150,20,35,.7);
  border-radius:22px;padding:32px 28px;max-width:380px;width:100%;box-shadow:5px 5px 0 rgba(0,0,0,.6)}
.logo{font-size:26px;font-weight:bold;letter-spacing:3px;text-transform:uppercase;text-align:center;
  background:linear-gradient(135deg,var(--red),var(--orange));-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text}
.tag{text-align:center;font-size:11px;color:var(--dim);margin:4px 0 20px}
.inp{width:100%;background:#0b0b12;border:1px solid var(--line);color:#fff;border-radius:10px;
  padding:11px 14px;font-size:13px;margin-bottom:9px}
.inp:focus{outline:none;border-color:var(--orange)}
.btn{width:100%;background:linear-gradient(135deg,var(--red),var(--orange));color:#fff;
  border:2px solid rgba(255,255,255,.15);border-bottom:4px solid rgba(0,0,0,.4);border-radius:30px;
  padding:11px;font-size:13px;font-weight:bold;cursor:pointer;text-transform:uppercase;letter-spacing:1px}
.btn.g{background:#fff;color:#222;border-color:#ccc}
.btn.d{background:#5865F2;border-color:#4752C4}
.sep{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:10px;margin:14px 0}
.sep::before,.sep::after{content:'';flex:1;height:1px;background:var(--line)}
.swap{text-align:center;font-size:11px;color:var(--blue);cursor:pointer;margin-top:12px}
.err{color:var(--red);font-size:11px;text-align:center;min-height:15px;margin-top:8px;line-height:1.5}

/* APP */
#app{display:none;height:100%;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--panel);
  border-bottom:1px solid var(--line);flex-shrink:0}
.top .name{font-size:16px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;
  background:linear-gradient(135deg,var(--red),var(--orange));-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text}
.ib{background:none;border:none;color:var(--dim);cursor:pointer;font-size:17px;padding:4px 6px}
.ib:hover{color:#fff}
.av{border-radius:50%;object-fit:cover;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;font-weight:bold;color:#fff}

/* FRIEND LIST */
#list{flex:1;overflow-y:auto;padding:8px}
.hint{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;padding:12px 10px 6px}
.f{display:flex;align-items:center;gap:11px;padding:11px;border-radius:14px;cursor:pointer;
  margin-bottom:4px;background:var(--panel2);border:1px solid var(--line)}
.f:active{transform:scale(.99)}
.f .av{width:44px;height:44px;font-size:17px}
.f .info{flex:1;min-width:0}
.f .nm{font-size:14px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f .sub{font-size:11px;color:var(--dim);margin-top:2px;display:flex;align-items:center;gap:5px}
.f .unread{background:var(--red);color:#fff;font-size:10px;font-weight:bold;
  min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 6px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.callbtn{background:rgba(0,204,122,.15);border:1px solid rgba(0,204,122,.4);color:var(--green);
  width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:15px;flex-shrink:0}
.empty{text-align:center;color:var(--dim);font-size:12px;padding:40px 20px;line-height:1.8}

/* CHAT */
#chat{display:none;flex-direction:column;height:100%}
.chead{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--panel);
  border-bottom:1px solid var(--line);flex-shrink:0}
.chead .av{width:34px;height:34px;font-size:14px}
#msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:7px}
.b{max-width:76%;padding:9px 13px;border-radius:18px;font-size:13px;line-height:1.5;
  word-wrap:break-word;white-space:pre-wrap}
.b.me{align-self:flex-end;background:linear-gradient(135deg,var(--red),var(--orange));color:#fff;
  border-bottom-right-radius:5px}
.b.them{align-self:flex-start;background:var(--panel2);border:1px solid var(--line);
  border-bottom-left-radius:5px}
.b img{max-width:100%;border-radius:12px;display:block;margin-top:5px;cursor:pointer}
.bt{font-size:9px;color:var(--dim);margin:0 6px;align-self:flex-end}
.b.me + .bt{align-self:flex-end}
.expiry{text-align:center;font-size:10px;color:var(--dim);padding:8px;line-height:1.7}
.comp{display:flex;gap:8px;align-items:flex-end;padding:10px 12px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));background:var(--panel);
  border-top:1px solid var(--line);flex-shrink:0}
#input{flex:1;background:#0b0b12;border:1px solid var(--line);color:#fff;border-radius:20px;
  padding:10px 14px;font-size:13px;resize:none;max-height:110px;line-height:1.4}
#input:focus{outline:none;border-color:var(--orange)}
.send{background:var(--red);border:none;color:#fff;width:38px;height:38px;border-radius:50%;
  cursor:pointer;font-size:15px;flex-shrink:0}
.send:disabled{opacity:.35}

/* CALL */
#call{display:none;position:fixed;inset:0;background:#07070b;z-index:200;
  flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
#call .av{width:110px;height:110px;font-size:42px}
.cname{font-size:20px;font-weight:bold}
.cstat{font-size:12px;color:var(--dim)}
.crow{display:flex;gap:14px;margin-top:14px}
.cbtn{width:60px;height:60px;border-radius:50%;border:none;cursor:pointer;font-size:22px;color:#fff}
.cbtn.end{background:var(--red)}
.cbtn.mute{background:#2a2a38}
.cbtn.answer{background:var(--green)}
#ring{display:none;position:fixed;top:14px;left:14px;right:14px;background:var(--panel);
  border:2px solid var(--green);border-radius:16px;padding:14px;z-index:210;
  align-items:center;gap:12px;box-shadow:0 8px 30px rgba(0,0,0,.6)}
#ring .av{width:42px;height:42px;font-size:16px}

#lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:220;
  align-items:center;justify-content:center;cursor:zoom-out}
#lb img{max-width:94vw;max-height:90vh;border-radius:12px}
</style>
</head>
<body>

<!-- GATE -->
<div id="boot" style="height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px">
  <div style="width:34px;height:34px;border:3px solid rgba(255,107,53,.2);border-top-color:var(--orange);
              border-radius:50%;animation:spin .8s linear infinite"></div>
  <div style="font-size:11px;color:var(--dim);letter-spacing:2px;text-transform:uppercase">CRIX CHAT</div>
</div>

<div id="gate" style="display:none">
  <div class="card">
    <div class="logo">CRIX CHAT</div>
    <div class="tag">Private chat &amp; calls with your Flappy Crix friends</div>
    <button class="btn g" id="gGoogle">Continue with Google</button>
    <button class="btn d" id="gDiscord" style="margin-top:8px;">Continue with Discord</button>
    <div class="sep">or</div>
    <input class="inp" type="email" id="email" placeholder="Email" autocomplete="email">
    <input class="inp" type="password" id="pass" placeholder="Password" autocomplete="current-password">
    <input class="inp" type="text" id="dname" placeholder="Display name" style="display:none">
    <button class="btn" id="gAuth">Sign in</button>
    <div class="swap" id="gSwap">Need an account? Sign up</div>
    <div class="err" id="gErr"></div>
    <div style="margin-top:16px;text-align:center;font-size:10px;color:var(--dim);line-height:1.7">
      Same account as <a href="/flappycrix" style="color:var(--green)">Flappy Crix</a>.
      Sign in here and you're signed in there too.
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="top">
    <div class="av" id="meAv" style="width:32px;height:32px;font-size:13px"></div>
    <span class="name">CRIX CHAT</span>
    <div style="margin-left:auto;display:flex;gap:2px">
      <button class="ib" id="soundBtn" title="Sound">🔊</button>
      <button class="ib" id="playBtn" title="Play Flappy Crix">🎮</button>
      <button class="ib" id="outBtn" title="Sign out">⏻</button>
    </div>
  </div>
  <div id="list"></div>
  <button id="newGroup" style="position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));
    width:54px;height:54px;border-radius:50%;border:none;cursor:pointer;font-size:22px;color:#fff;
    background:linear-gradient(135deg,var(--red),var(--orange));box-shadow:0 6px 20px rgba(0,0,0,.5);z-index:50">+</button>
</div>

<div id="groupModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:150;
  align-items:center;justify-content:center;padding:20px">
  <div class="card" style="max-width:400px">
    <div style="font-size:16px;font-weight:bold;margin-bottom:4px">New group</div>
    <div style="font-size:11px;color:var(--dim);margin-bottom:14px">Pick who to include</div>
    <input class="inp" id="groupName" placeholder="Group name" maxlength="30">
    <div id="groupPick" style="max-height:220px;overflow-y:auto;margin:10px 0"></div>
    <button class="btn" id="groupCreate">Create group</button>
    <button class="btn" id="groupCancel" style="background:var(--panel2);border-color:var(--line);margin-top:8px">Cancel</button>
    <div class="err" id="groupErr"></div>
  </div>
</div>

<!-- CHAT -->
<div id="chat">
  <div class="chead">
    <button class="ib" id="backBtn">←</button>
    <div class="av" id="peerAv"></div>
    <div style="flex:1;min-width:0">
      <div id="peerName" style="font-size:14px;color:#fff"></div>
      <div id="peerStat" style="font-size:10px;color:var(--dim)"></div>
    </div>
    <button class="callbtn" id="callBtn" title="Voice call">📞</button>
  </div>
  <div id="msgs"></div>
  <div class="comp">
    <input type="file" id="file" accept="image/*" style="display:none">
    <button class="ib" id="fileBtn" style="font-size:20px">＋</button>
    <textarea id="input" rows="1" placeholder="Message" maxlength="1000"></textarea>
    <button class="send" id="sendBtn" disabled>➤</button>
  </div>
</div>

<!-- CALL -->
<div id="call">
  <div class="av" id="callAv"></div>
  <div class="cname" id="callName"></div>
  <div class="cstat" id="callStat">Calling…</div>
  <div class="crow">
    <button class="cbtn mute" id="muteBtn">🎤</button>
    <button class="cbtn end" id="endBtn">📵</button>
  </div>
  <audio id="remoteAudio" autoplay></audio>
</div>

<div id="ring">
  <div class="av" id="ringAv"></div>
  <div style="flex:1;min-width:0">
    <div id="ringName" style="font-size:14px;color:#fff"></div>
    <div style="font-size:10px;color:var(--dim)">Incoming call</div>
  </div>
  <button class="cbtn answer" id="ansBtn" style="width:44px;height:44px;font-size:17px">📞</button>
  <button class="cbtn end" id="declineBtn" style="width:44px;height:44px;font-size:17px">✕</button>
</div>

<div id="lb"><img id="lbImg" src="" alt=""></div>

<script>
const $ = i => document.getElementById(i);
const esc = s => { const d = document.createElement('div'); d.textContent = String(s ?? ''); return d.innerHTML; };
const MSG_TTL = 24 * 60 * 60 * 1000;   // messages vanish after 24 hours

/* ---------- SOUND ---------- */
// Files are optional — a missing one is skipped rather than erroring.
const sfx = {};
['message','send','notify','call','ringtone','join','pop','error'].forEach(n => {
  const a = new Audio('/img/' + n + '.mp3');
  a.preload = 'auto';
  a.addEventListener('error', () => { sfx[n] = null; }, { once: true });
  sfx[n] = a;
});
let soundOn = true;
try { soundOn = localStorage.getItem('crixchat_sound') !== '0'; } catch {}

function beep(name, vol, loop) {
  const a = sfx[name];
  if (!a || !soundOn) return null;
  try {
    const c = a.cloneNode();
    c.volume = vol ?? 0.7;
    c.loop = !!loop;
    c.play().catch(() => {});
    return c;
  } catch { return null; }
}

let auth, db, me = null, profile = {}, peer = null;
let unsubMsgs = null, unsubFriends = null, unsubCalls = null, isSignUp = false;
let pc = null, localStream = null, callDoc = null, callTimer = null;
let ringTone = null, lastSeenMsg = null;

/* ---------- BOOT ---------- */
(async function () {
  let cfg;
  try { cfg = await (await fetch('/api.json?cb=' + Date.now())).json(); }
  catch { $('gErr').textContent = 'Could not load configuration.'; return; }
  window.__cfg = cfg;

  try {
    firebase.initializeApp(cfg.firebase);
    auth = firebase.auth(); db = firebase.firestore();
  } catch (e) { $('gErr').textContent = 'Firebase failed: ' + e.message; return; }

  if (typeof PlayFabManager !== 'undefined') await PlayFabManager.init(cfg.playfab || {});
  handleDiscordReturn();

  // Firebase persists the session per-origin, so signing in on Flappy Crix
  // signs you in here automatically and vice versa — nothing extra needed.
  auth.onAuthStateChanged(async user => {
    $('boot').style.display = 'none';
    if (!user) { $('gate').style.display = 'flex'; $('app').style.display = 'none'; $('chat').style.display = 'none'; return; }
    me = user;
    $('gate').style.display = 'none';
    $('app').style.display = 'flex';

    try {
      if (typeof PlayFabManager !== 'undefined' && !PlayFabManager.isReady)
        await PlayFabManager.login(user.uid, user.displayName || 'Player');
      const s = await PlayFabManager.loadStats(['level']).catch(() => ({}));
      profile = { uid:user.uid, name:user.displayName || (user.email||'').split('@')[0] || 'Player',
                  photo:user.photoURL || null, roles:PlayFabManager.roles || [],
                  level:s.level || 1, pfId:PlayFabManager.playFabId || null };
    } catch {
      profile = { uid:user.uid, name:user.displayName || 'Player', photo:user.photoURL || null,
                  roles:[], level:1, pfId:null };
    }
    renderMe();
    watchFriends();
    watchCalls();
    purgeOld();
  });
})();

/* ---------- AUTH ---------- */
$('gSwap').onclick = () => {
  isSignUp = !isSignUp;
  $('dname').style.display = isSignUp ? '' : 'none';
  $('gAuth').textContent = isSignUp ? 'Create account' : 'Sign in';
  $('gSwap').textContent = isSignUp ? 'Already have one? Sign in' : 'Need an account? Sign up';
  $('gErr').textContent = '';
};
$('gGoogle').onclick = async () => {
  const p = new firebase.auth.GoogleAuthProvider();
  p.setCustomParameters({ prompt:'select_account' });
  try { await auth.signInWithPopup(p); }
  catch (e) {
    if (e.code === 'auth/popup-blocked') return auth.signInWithRedirect(p);
    if (e.code !== 'auth/popup-closed-by-user') $('gErr').textContent = e.message;
  }
};
$('gAuth').onclick = async () => {
  const em = $('email').value.trim(), pw = $('pass').value, nm = $('dname').value.trim();
  if (!em || !pw) { $('gErr').textContent = 'Enter an email and password.'; return; }
  if (isSignUp && !nm) { $('gErr').textContent = 'Choose a display name.'; return; }
  $('gAuth').disabled = true;
  try {
    if (isSignUp) {
      const c = await auth.createUserWithEmailAndPassword(em, pw);
      await c.user.updateProfile({ displayName: nm });
      await c.user.sendEmailVerification().catch(()=>{});
    } else await auth.signInWithEmailAndPassword(em, pw);
  } catch (e) {
    const m = { 'auth/email-already-in-use':'That email already has an account.',
      'auth/wrong-password':'Incorrect password.','auth/user-not-found':'No account with that email.',
      'auth/invalid-credential':'Incorrect email or password.','auth/invalid-email':'Invalid email.' };
    $('gErr').textContent = m[e.code] || e.message;
  } finally { $('gAuth').disabled = false; }
};
$('outBtn').onclick = () => { endCall(); auth.signOut(); };
$('playBtn').onclick = () => location.href = '/flappycrix';
$('soundBtn').textContent = soundOn ? '🔊' : '🔇';
$('soundBtn').onclick = function () {
  soundOn = !soundOn;
  try { localStorage.setItem('crixchat_sound', soundOn ? '1' : '0'); } catch {}
  this.textContent = soundOn ? '🔊' : '🔇';
  if (soundOn) beep('pop', .5);
};

/* ---------- DISCORD ---------- */
$('gDiscord').onclick = () => {
  const d = window.__cfg?.discord || {};
  if (!d.clientId || d.clientId.startsWith('PASTE_')) {
    $('gErr').textContent = 'Discord is not configured — add clientId to api.json.';
    return;
  }
  const state = Math.random().toString(36).slice(2);
  try { sessionStorage.setItem('dc_state', state); } catch {}
  const u = new URL('https://discord.com/api/oauth2/authorize');
  u.searchParams.set('client_id', d.clientId);
  u.searchParams.set('redirect_uri', d.redirectUri || location.origin + '/chat');
  u.searchParams.set('response_type', 'code');
  u.searchParams.set('scope', 'identify');
  u.searchParams.set('state', state);
  location.href = u.toString();
};

async function handleDiscordReturn() {
  const q = new URLSearchParams(location.search);
  const code = q.get('code');
  if (!code) return;
  history.replaceState(null, '', location.pathname);
  $('gErr').style.color = 'var(--green)';
  $('gErr').textContent = 'Signing in with Discord…';
  try {
    const r = await fetch('/api/discord-auth', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ code })
    });
    if (r.status === 404) throw new Error('/api/discord-auth is not deployed. Push the api/ folder and package.json.');
    const ct = r.headers.get('content-type') || '';
    if (!ct.includes('json')) throw new Error('The auth function returned ' + r.status + ' — it is missing or crashed.');
    const d = await r.json();
    if (!r.ok || !d.token) throw new Error(d.detail || d.error || 'Server returned ' + r.status);
    await auth.signInWithCustomToken(d.token);
  } catch (e) {
    $('gErr').style.color = 'var(--red)';
    $('gErr').textContent = 'Discord: ' + e.message;
    console.error('[Discord]', e);
  }
}

/* ---------- FRIENDS ---------- */
function colour(uid) {
  const p = ['#FF4655','#FF6B35','#00CC7A','#27A9F5','#FFD700','#B47AFF','#FF8AC4'];
  let h = 0; for (let i=0;i<(uid||'').length;i++) h = (h*31 + uid.charCodeAt(i))|0;
  return p[Math.abs(h) % p.length];
}
function avatar(o, size, cls) {
  const ini = esc((o.name||'?').charAt(0).toUpperCase());
  return o.photo
    ? `<img class="av ${cls||''}" src="${esc(o.photo)}" style="width:${size}px;height:${size}px" alt="">`
    : `<div class="av ${cls||''}" style="width:${size}px;height:${size}px;font-size:${size*0.4}px;background:${colour(o.uid)}">${ini}</div>`;
}

async function watchFriends() {
  $('list').innerHTML = '<div class="empty">Loading friends…</div>';
  let friends = [];
  try {
    friends = await PlayFabManager.getFriends();
    friends = friends.filter(f => (f.tags||[]).includes('friend') || !(f.tags||[]).length);
  } catch (e) {
    $('list').innerHTML = `<div class="empty">Could not load friends.<br><span style="font-size:10px">${esc(e.message)}</span></div>`;
    return;
  }
  if (!friends.length) {
    $('list').innerHTML = `<div class="empty">No friends yet.<br><br>
      Add people in <a href="/flappycrix" style="color:var(--green)">Flappy Crix</a> —
      they show up here automatically.</div>`;
    return;
  }

  // live presence + unread counts
  if (unsubFriends) unsubFriends();
  unsubFriends = db.collection('presence').onSnapshot(snap => {
    const pres = {};
    const now = Date.now();
    snap.forEach(d => {
      const v = d.data();
      const age = v.at?.toMillis ? now - v.at.toMillis() : 1e9;
      if (age < 120000 && v.status !== 'offline') pres[v.playFabId] = v;
    });
    loadGroups().then(g => { window.__groups = g; renderFriends(friends, pres); });
  }, () => renderFriends(friends, {}));
}

function renderFriends(friends, pres) {
  allFriends = friends;
  const online = friends.filter(f => pres[f.playFabId]);
  const offline = friends.filter(f => !pres[f.playFabId]);
  const row = f => {
    const p = pres[f.playFabId];
    const o = { uid:f.playFabId, name:f.displayName.replace(/#.*$/,''), photo:f.avatarUrl };
    const where = p ? (p.roomCode ? 'In a Flappy Crix lobby' : 'Online') : 'Offline';
    return `<div class="f" data-id="${esc(f.playFabId)}" data-name="${esc(o.name)}" data-photo="${esc(o.photo||'')}">
      ${avatar(o, 44)}
      <div class="info">
        <div class="nm">${esc(o.name)}</div>
        <div class="sub"><span class="dot" style="background:${p?'var(--green)':'#555'}"></span>${where}</div>
      </div>
      <span class="unread" data-unread="${esc(f.playFabId)}" style="display:none">0</span>
      <button class="callbtn" data-call="${esc(f.playFabId)}">📞</button>
    </div>`;
  };
  const groupRows = (window.__groups || []).map(g => `
    <div class="f" data-group="${esc(g.id)}" data-name="${esc(g.name)}">
      <div class="av" style="width:44px;height:44px;font-size:17px;background:var(--blue)">👥</div>
      <div class="info">
        <div class="nm">${esc(g.name)}</div>
        <div class="sub">${(g.members||[]).length} members</div>
      </div>
    </div>`).join('');

  $('list').innerHTML =
    (groupRows ? `<div class="hint">Groups</div>` + groupRows : '') +
    (online.length ? `<div class="hint">Online — ${online.length}</div>` + online.map(row).join('') : '') +
    (offline.length ? `<div class="hint">Offline</div>` + offline.map(row).join('') : '');

  $('list').querySelectorAll('[data-group]').forEach(el =>
    el.onclick = () => openChat(el.dataset.group, el.dataset.name, null, true));

  $('list').querySelectorAll('.f').forEach(el => {
    el.onclick = e => {
      if (e.target.dataset.call) return;
      openChat(el.dataset.id, el.dataset.name, el.dataset.photo);
    };
  });
  $('list').querySelectorAll('[data-call]').forEach(b => b.onclick = e => {
    e.stopPropagation();
    const f = b.closest('.f');
    startCall(f.dataset.id, f.dataset.name, f.dataset.photo);
  });
  countUnread();
}

/* ---------- DIRECT MESSAGES ---------- */
// DM ids are the two member ids sorted, so both sides resolve the same
// document without needing a lookup. Groups get a generated id instead.
function threadId(a, b) { return [a, b].sort().join('__'); }
function activeThread() {
  return peer?.group ? peer.id : threadId(profile.pfId || profile.uid, peer.id);
}

function openChat(id, name, photo, group) {
  peer = { id, name, photo: photo || null, group: !!group };
  $('app').style.display = 'none';
  $('chat').style.display = 'flex';
  $('peerName').textContent = name;
  $('peerAv').outerHTML = avatar({ uid:id, name, photo }, 34).replace('class="av "', 'class="av" id="peerAv"');
  $('peerStat').textContent = peer.group
    ? 'Group · messages disappear after 24 hours'
    : 'Messages disappear after 24 hours';
  $('callBtn').style.display = peer.group ? 'none' : '';   // calls are 1:1 only
  listenMessages();
  markRead(id);
}
$('backBtn').onclick = () => {
  if (unsubMsgs) unsubMsgs();
  peer = null;
  $('chat').style.display = 'none';
  $('app').style.display = 'flex';
};

function listenMessages() {
  if (unsubMsgs) unsubMsgs();
  const t = activeThread();
  $('msgs').innerHTML = '<div class="expiry">Loading…</div>';

  unsubMsgs = db.collection('dms').doc(t).collection('messages')
    .orderBy('at','desc').limit(100)
    .onSnapshot(snap => {
      const now = Date.now();
      const msgs = snap.docs.map(d => ({ id:d.id, ...d.data() }))
        .filter(m => {
          const age = m.at?.toMillis ? now - m.at.toMillis() : 0;
          if (age > MSG_TTL) {
            // Expired — remove it rather than showing stale history
            db.collection('dms').doc(t).collection('messages').doc(m.id).delete().catch(()=>{});
            return false;
          }
          return true;
        }).reverse();
      // Only chime for messages that arrived from the other person
      const mine = profile.pfId || profile.uid;
      const newest = msgs[msgs.length - 1];
      if (newest && newest.from !== mine && newest.id !== lastSeenMsg) {
        if (lastSeenMsg !== null) beep('message', .6);
        lastSeenMsg = newest.id;
      }
      renderMessages(msgs);
      markRead(peer.id);
    }, err => {
      $('msgs').innerHTML = `<div class="expiry" style="color:var(--red)">
        ${/permission/i.test(err.message) ? 'Publish firestore.rules to enable messages.' : esc(err.message)}</div>`;
    });
}

function renderMessages(msgs) {
  const box = $('msgs');
  const bottom = box.scrollHeight - box.scrollTop - box.clientHeight < 140;
  if (!msgs.length) {
    box.innerHTML = '<div class="expiry">No messages yet.<br>Anything sent here disappears after 24 hours.</div>';
    return;
  }
  const mine = profile.pfId || profile.uid;
  box.innerHTML = '<div class="expiry">Messages disappear after 24 hours</div>' + msgs.map(m => {
    const isMe = m.from === mine;
    const t = m.at?.toDate ? m.at.toDate() : new Date();
    const time = t.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
    const img = m.image ? `<img src="${esc(m.image)}" alt="" loading="lazy">` : '';
    // In a group you need to know who said what
    const who = (peer.group && !isMe)
      ? `<div style="font-size:10px;color:var(--orange);margin-bottom:3px">${esc(m.name||'')}</div>` : '';
    return `<div class="b ${isMe?'me':'them'}">${who}${esc(m.text||'')}${img}</div>
            <div class="bt" style="align-self:${isMe?'flex-end':'flex-start'}">${time}</div>`;
  }).join('');
  box.querySelectorAll('.b img').forEach(i => i.onclick = () => {
    $('lbImg').src = i.src; $('lb').style.display = 'flex';
  });
  if (bottom) box.scrollTop = box.scrollHeight;
}

const input = $('input');
input.oninput = () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 110) + 'px';
  $('sendBtn').disabled = !input.value.trim();
};
input.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
$('sendBtn').onclick = () => send();

let lastSent = 0;
async function send(image) {
  const raw = input.value.trim();
  if (!raw && !image) return;
  if (Date.now() - lastSent < 800) return;
  lastSent = Date.now();
  const clean = typeof ChatFilter !== 'undefined' ? ChatFilter.clean(raw) : raw;
  input.value = ''; input.style.height = 'auto'; $('sendBtn').disabled = true;

  const mine = profile.pfId || profile.uid;
  const t = threadId(mine, peer.id);
  try {
    await db.collection('dms').doc(t).set({
      members: [mine, peer.id], updated: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge:true });
    beep('send', .4);
    await db.collection('dms').doc(t).collection('messages').add({
      from: mine, fromUid: profile.uid, name: profile.name,
      text: clean, image: image || null,
      at: firebase.firestore.FieldValue.serverTimestamp(),
      expiresAt: Date.now() + MSG_TTL
    });
  } catch (e) {
    $('peerStat').textContent = /permission/i.test(e.message)
      ? 'Blocked — publish firestore.rules' : 'Could not send';
  }
}

$('fileBtn').onclick = () => $('file').click();
$('file').onchange = async function () {
  const f = this.files && this.files[0]; this.value = '';
  if (!f) return;
  $('peerStat').textContent = 'Preparing…';
  try {
    // Images are stored inline in the message document rather than uploaded
    // to Cloud Storage. Firestore allows ~1MB per document and a shrunken
    // photo is well under that, so this needs no extra Firebase product —
    // which matters because new projects must enable billing to use Storage.
    const dataUrl = await shrinkToDataUrl(f, 900, 0.78);
    const kb = Math.round(dataUrl.length * 0.75 / 1024);
    if (dataUrl.length > 700000) {
      $('peerStat').textContent = 'That image is too detailed to send — try a smaller one.';
      setTimeout(() => { $('peerStat').textContent = 'Messages disappear after 24 hours'; }, 5000);
      return;
    }
    $('peerStat').textContent = `Sending (${kb}KB)…`;
    await send(dataUrl);
    $('peerStat').textContent = 'Messages disappear after 24 hours';
  } catch (e) {
    console.error('[Image]', e.message);
    $('peerStat').textContent = /permission/i.test(e.message)
      ? 'Blocked — publish firestore.rules.'
      : 'Could not send that image: ' + e.message;
    setTimeout(() => { $('peerStat').textContent = 'Messages disappear after 24 hours'; }, 6000);
  }
};
$('lb').onclick = () => $('lb').style.display = 'none';

// Downscales and returns a JPEG data URL, dropping quality further if the
// result is still too large for a Firestore document.
function shrinkToDataUrl(file, max, quality) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      let { width:w, height:h } = img;
      if (w > max || h > max) { const s = max / Math.max(w, h); w = Math.round(w*s); h = Math.round(h*s); }
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      let q = quality, url = cv.toDataURL('image/jpeg', q);
      // Step the quality down rather than rejecting a busy photo outright
      while (url.length > 650000 && q > 0.35) { q -= 0.12; url = cv.toDataURL('image/jpeg', q); }
      URL.revokeObjectURL(img.src);
      res(url);
    };
    img.onerror = () => rej(new Error('That file is not a readable image'));
    img.src = URL.createObjectURL(file);
  });
}

/* ---------- GROUPS ---------- */
let allFriends = [];

$('newGroup').onclick = () => {
  if (!allFriends.length) { alert('Add friends in Flappy Crix first.'); return; }
  $('groupName').value = '';
  $('groupErr').textContent = '';
  $('groupPick').innerHTML = allFriends.map(f => {
    const n = esc(f.displayName.replace(/#.*$/, ''));
    return `<label style="display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer">
      <input type="checkbox" value="${esc(f.playFabId)}" data-name="${n}" style="width:17px;height:17px;accent-color:#FF4655">
      ${avatar({ uid:f.playFabId, name:n, photo:f.avatarUrl }, 30)}
      <span style="font-size:13px">${n}</span>
    </label>`;
  }).join('');
  $('groupModal').style.display = 'flex';
};
$('groupCancel').onclick = () => $('groupModal').style.display = 'none';

$('groupCreate').onclick = async () => {
  const picked = [...$('groupPick').querySelectorAll('input:checked')];
  const name = $('groupName').value.trim();
  if (picked.length < 2) { $('groupErr').textContent = 'Pick at least 2 people — use a direct message for one.'; return; }
  if (!name) { $('groupErr').textContent = 'Give the group a name.'; return; }

  const mine = profile.pfId || profile.uid;
  const members = [mine, ...picked.map(p => p.value)];
  const id = 'g_' + Math.random().toString(36).slice(2, 10);

  try {
    await db.collection('dms').doc(id).set({
      group: true, name, members,
      memberNames: Object.fromEntries(
        [[mine, profile.name], ...picked.map(p => [p.value, p.dataset.name])]),
      createdBy: mine, createdUid: profile.uid,
      updated: firebase.firestore.FieldValue.serverTimestamp()
    });
    $('groupModal').style.display = 'none';
    openChat(id, name, null, true);
    watchFriends();
  } catch (e) {
    $('groupErr').textContent = /permission/i.test(e.message)
      ? 'Blocked — publish firestore.rules.' : e.message;
  }
};

// Groups the player belongs to, shown above the friends list
async function loadGroups() {
  const mine = profile.pfId || profile.uid;
  try {
    const snap = await db.collection('dms').where('members','array-contains',mine).get();
    return snap.docs.map(d => ({ id:d.id, ...d.data() })).filter(g => g.group);
  } catch { return []; }
}

/* ---------- UNREAD ---------- */
function markRead(id) {
  try { localStorage.setItem('read_' + id, String(Date.now())); } catch {}
}
async function countUnread() {
  const mine = profile.pfId || profile.uid;
  document.querySelectorAll('[data-unread]').forEach(async el => {
    const id = el.dataset.unread;
    let since = 0;
    try { since = parseInt(localStorage.getItem('read_' + id)) || 0; } catch {}
    try {
      const snap = await db.collection('dms').doc(threadId(mine, id))
        .collection('messages').where('from','==',id).orderBy('at','desc').limit(20).get();
      const n = snap.docs.filter(d => (d.data().at?.toMillis?.() || 0) > since).length;
      el.style.display = n ? 'flex' : 'none';
      el.textContent = n > 9 ? '9+' : n;
    } catch {}
  });
}

/* ---------- 24 HOUR CLEANUP ---------- */
// Firestore has no client-side TTL, so expired messages are removed whenever
// a thread is opened, plus a sweep of recent threads on sign-in.
async function purgeOld() {
  const mine = profile.pfId || profile.uid;
  try {
    const threads = await db.collection('dms').where('members','array-contains',mine).limit(20).get();
    const cutoff = Date.now() - MSG_TTL;
    for (const t of threads.docs) {
      const old = await t.ref.collection('messages').where('expiresAt','<',cutoff).limit(50).get();
      await Promise.all(old.docs.map(d => d.ref.delete().catch(()=>{})));
    }
  } catch {}
}

/* ---------- VOICE CALLS (WebRTC) ---------- */
const ICE = { iceServers:[{ urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302'] }] };

async function startCall(id, name, photo) {
  const mine = profile.pfId || profile.uid;
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio:true });
  } catch {
    alert('Microphone access is needed to make a call.');
    return;
  }
  showCall({ uid:id, name, photo }, 'Calling…');

  pc = new RTCPeerConnection(ICE);
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  pc.ontrack = e => { $('remoteAudio').srcObject = e.streams[0]; $('callStat').textContent = 'Connected'; };

  callDoc = db.collection('calls').doc();
  const offerCands = callDoc.collection('offerCandidates');
  const answerCands = callDoc.collection('answerCandidates');
  pc.onicecandidate = e => e.candidate && offerCands.add(e.candidate.toJSON());

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  await callDoc.set({
    from: mine, fromName: profile.name, fromPhoto: profile.photo || null,
    to: id, status:'ringing',
    offer: { sdp: offer.sdp, type: offer.type },
    at: Date.now()
  });

  callTimer = callDoc.onSnapshot(s => {
    const d = s.data();
    if (!d) return;
    if (d.status === 'declined') { $('callStat').textContent = 'Declined'; setTimeout(endCall, 1200); }
    if (d.answer && !pc.currentRemoteDescription) {
      pc.setRemoteDescription(new RTCSessionDescription(d.answer));
      $('callStat').textContent = 'Connected';
    }
  });
  answerCands.onSnapshot(s => s.docChanges().forEach(ch => {
    if (ch.type === 'added') pc.addIceCandidate(new RTCIceCandidate(ch.doc.data()));
  }));

  // Give up if nobody answers
  setTimeout(() => { if (pc && !pc.currentRemoteDescription) { $('callStat').textContent = 'No answer'; setTimeout(endCall, 1200); } }, 40000);
}

function watchCalls() {
  const mine = profile.pfId || profile.uid;
  if (unsubCalls) unsubCalls();
  unsubCalls = db.collection('calls').where('to','==',mine).where('status','==','ringing')
    .onSnapshot(s => {
      const d = s.docs[0];
      if (!d) { $('ring').style.display = 'none'; return; }
      const v = d.data();
      if (Date.now() - (v.at||0) > 60000) { d.ref.delete().catch(()=>{}); return; }
      $('ringName').textContent = v.fromName || 'Someone';
      $('ringAv').outerHTML = avatar({ uid:v.from, name:v.fromName, photo:v.fromPhoto }, 42)
                                .replace('class="av "','class="av" id="ringAv"');
      if (!ringTone) ringTone = beep('ringtone', .8, true);
      $('ring').style.display = 'flex';
      $('ansBtn').onclick = () => answer(d.ref, v);
      $('declineBtn').onclick = () => { d.ref.update({ status:'declined' }); $('ring').style.display='none';
        if (ringTone) { try { ringTone.pause(); } catch {} ringTone = null; } };
    }, () => {});
}

async function answer(ref, v) {
  $('ring').style.display = 'none';
  if (ringTone) { try { ringTone.pause(); } catch {} ringTone = null; }
  try { localStream = await navigator.mediaDevices.getUserMedia({ audio:true }); }
  catch { alert('Microphone access is needed to answer.'); return; }

  showCall({ uid:v.from, name:v.fromName, photo:v.fromPhoto }, 'Connecting…');
  callDoc = ref;
  pc = new RTCPeerConnection(ICE);
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  pc.ontrack = e => { $('remoteAudio').srcObject = e.streams[0]; $('callStat').textContent = 'Connected'; };
  pc.onicecandidate = e => e.candidate && ref.collection('answerCandidates').add(e.candidate.toJSON());

  await pc.setRemoteDescription(new RTCSessionDescription(v.offer));
  const ans = await pc.createAnswer();
  await pc.setLocalDescription(ans);
  await ref.update({ status:'active', answer:{ sdp:ans.sdp, type:ans.type } });

  ref.collection('offerCandidates').onSnapshot(s => s.docChanges().forEach(ch => {
    if (ch.type === 'added') pc.addIceCandidate(new RTCIceCandidate(ch.doc.data()));
  }));
  callTimer = ref.onSnapshot(s => { if (!s.exists || s.data()?.status === 'ended') endCall(); });
}

function showCall(o, status) {
  $('callAv').outerHTML = avatar(o, 110).replace('class="av "','class="av" id="callAv"');
  $('callName').textContent = o.name;
  $('callStat').textContent = status;
  $('call').style.display = 'flex';
}

function endCall() {
  if (ringTone) { try { ringTone.pause(); } catch {} ringTone = null; }
  if (callTimer) { callTimer(); callTimer = null; }
  if (pc) { try { pc.close(); } catch {} pc = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  if (callDoc) { callDoc.update({ status:'ended' }).catch(()=>{}); callDoc.delete?.().catch?.(()=>{}); callDoc = null; }
  $('call').style.display = 'none';
  $('remoteAudio').srcObject = null;
}
$('endBtn').onclick = endCall;
$('muteBtn').onclick = function () {
  if (!localStream) return;
  const track = localStream.getAudioTracks()[0];
  track.enabled = !track.enabled;
  this.textContent = track.enabled ? '🎤' : '🔇';
  this.style.background = track.enabled ? '#2a2a38' : 'var(--red)';
};
$('callBtn').onclick = () => peer && startCall(peer.id, peer.name, peer.photo);
window.addEventListener('beforeunload', endCall);

function renderMe() {
  $('meAv').outerHTML = avatar(profile, 32).replace('class="av "','class="av" id="meAv"');
}
</script>
