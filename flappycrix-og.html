<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>FLAPPY CRIX • THE ORIGINAL</title>
    <meta name="description" content="The very first Flappy Crix, from 18 March 2026.">
    <meta name="theme-color" content="#0A0A0F">
    <script src="/birthday.js?v=2026100201"></script>
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/img/favicon-192.png">
    <link rel="apple-touch-icon" href="/img/favicon-192.png">
    <!--
        FLAPPY CRIX — THE ORIGINAL
        ==========================
        The game as it first went up: game.html was uploaded on 18 March 2026
        at 5:36pm (AEDT), and the main page got its PLAY FLAPPY CRIX button 24
        minutes later. This is that game, lifted out of OG.html (the old main
        page, where it ran in a pop-up) — same look, same pipes, same physics,
        same sounds.

        This is the Birthday season. All of March from 2027 /flappycrix starts
        everyone here (Sydney time, like the other seasons), with a button to
        switch to the new game and back, and sends them back to the new game
        when March is over; staff can also switch it on early from the seasons
        settings. The rest of the year it is still here at /flappycrix-og, as
        a museum.

        Fixed, without changing how it plays:
          - Tapping or clicking never made it jump. Only the keyboard was ever
            wired up (the click branch of handleJump was never attached), so
            on a phone it could not be played at all.
          - It moved once per painted frame, so a 144Hz monitor ran it 2.4x
            as fast as a 60Hz one. It runs at the 60 steps a second it was
            tuned on, whatever the screen.
          - Hitting a pipe and the floor on the same frame, or two pipes,
            played the death sound twice.
          - The bird, the font and the sounds came from raw.githubusercontent;
            they come from this site, so it works offline too.
    -->
    <style>
        @font-face {
            font-family: 'CRIX Pixel';
            src: url('/img/font.woff2') format('woff2'), url('/img/font.otf') format('opentype');
            font-weight: normal; font-style: normal; font-display: swap;
        }
        /* ORIGINAL CYBER STYLE - NO SHADOWS, NO CARTOON */
        :root {
            --neon-red: #FF4655;
            --neon-orange: #FF6B35;
            --matrix-green: #00FF9D;
            --dark-bg: #0A0A0F;
            --grid-color: rgba(255, 70, 85, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { background: var(--dark-bg); }
        body {
            font-family: 'CRIX Pixel', 'Courier New', monospace;
            background: var(--dark-bg);
            color: white;
            background-image:
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 50px 50px;
            min-height: 100vh;
            padding: 16px 16px max(24px, env(safe-area-inset-bottom));
        }

        /* the birthday line along the top */
        .og-banner {
            max-width: 500px; margin: 0 auto 14px; padding: 12px 14px;
            border: 2px solid var(--neon-orange); background: rgba(10,10,15,.9);
            text-align: center; line-height: 1.5; font-size: 13px; color: #ddd;
        }
        .og-banner b { color: var(--matrix-green); font-weight: normal; font-size: 16px; display: block; letter-spacing: 1px; }
        .og-banner a { color: var(--neon-orange); }
        .og-banner .og-time { color: var(--neon-orange); }
        .og-banner .og-gift { display: block; margin-top: 8px; color: #FFD84D; }
        .og-switch {
            display: inline-block; margin-top: 10px; padding: 9px 16px;
            border: 2px solid var(--matrix-green); background: transparent; color: var(--matrix-green);
            font: inherit; font-size: 14px; letter-spacing: 1px; cursor: pointer; text-decoration: none;
        }
        .og-switch:hover { background: rgba(0,255,157,.12); }
        .og-switch.gift { border-color: #FFD84D; color: #FFD84D; }

        /* The pop-up from the old main page, standing on its own */
        .game-modal-content {
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            background: var(--dark-bg);
            border: 3px solid var(--neon-red);
            padding: 20px;
        }
        .game-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--matrix-green);
            padding-bottom: 10px;
        }
        .game-modal-title {
            font-size: 28px;
            color: var(--matrix-green);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .og-music {
            background: transparent;
            border: 2px solid var(--neon-red);
            color: var(--neon-red);
            font-size: 22px;
            width: 50px; height: 50px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .og-music:hover { background: var(--neon-red); color: white; }

        /* FLAPPY BIRD CANVAS */
        #gameCanvas {
            display: block;
            width: 100%;
            max-width: 400px;
            height: auto;
            margin: 0 auto;
            border: 2px solid var(--neon-orange);
            background: linear-gradient(180deg, #1a1a2e 0%, #0a0a1a 100%);
            touch-action: manipulation;
            -webkit-user-select: none; user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: pointer;
        }
        .game-score {
            text-align: center;
            font-size: 24px;
            color: var(--neon-orange);
            margin: 15px 0;
        }
        .game-controls { text-align: center; margin: 15px 0; }
        .game-start-btn {
            background: linear-gradient(45deg, var(--matrix-green), #00F0FF);
            color: white;
            border: 2px solid var(--neon-red);
            padding: 10px 30px;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .game-start-btn:hover { transform: scale(1.05); border-color: var(--matrix-green); }
        .og-hint { color: #aaa; text-align: center; margin-top: 10px; font-size: 14px; }
        .og-foot { text-align: center; margin-top: 14px; font-size: 11px; color: #666; }
    </style>
</head>
<body>
    <div class="og-banner" id="ogBanner">
        <b>🎮 THE ORIGINAL FLAPPY CRIX</b>
        The very first version, from 18 March 2026.
        <a href="/flappycrix?modern=1" id="ogBack">Play the current game →</a>
    </div>

    <div class="game-modal-content">
        <div class="game-modal-header">
            <div class="game-modal-title">🎮 FLAPPY CRIX</div>
            <button class="og-music" id="musicToggleBtn" title="Music">🔇</button>
        </div>

        <canvas id="gameCanvas" width="400" height="600"></canvas>

        <div class="game-score" id="gameScore">Score: 0</div>

        <div class="game-controls">
            <button class="game-start-btn" id="startGameBtn">START GAME</button>
        </div>

        <div class="og-hint">Press SPACE, CLICK or TAP to jump</div>
    </div>
    <div class="og-foot">first uploaded 18 March 2026 · CRIXGAMING VR</div>

    <audio id="bgMusic" loop preload="none"><source src="/img/music.mp3" type="audio/mpeg"></audio>
    <audio id="hoverSound" preload="auto"><source src="/img/hover.mp3" type="audio/mpeg"></audio>
    <audio id="clickSound" preload="auto"><source src="/img/click.mp3" type="audio/mpeg"></audio>
    <audio id="jumpSound" preload="auto"><source src="/img/jump.mp3" type="audio/mpeg"></audio>
    <audio id="deathSound" preload="auto"><source src="/img/death.mp3" type="audio/mpeg"></audio>
    <audio id="selectSound" preload="auto"><source src="/img/select.mp3" type="audio/mpeg"></audio>

    <script>
    (function () {
        'use strict';

        /* ---- the Birthday season ----
           All of March from 2027 (Sydney time) is Flappy Crix's birthday
           month. /flappycrix starts everyone here, and the button in the
           banner switches to the new game — remembered for the month, so
           they are not sent back. On 18 March the new game also hands out a
           free Golden Party Hat, so that day the banner says so.

           birthday.js has the rules, shared with /flappycrix, including the
           staff settings (on early for everyone, or just for themselves).
           This page has no Firebase, so while someone is here for the
           birthday it re-reads the for-everyone setting from Firestore once
           a minute, and switching the season off sends them back.
           ?anniversary=1 previews it; ?modern=1 on /flappycrix skips it. */
        const B = window.CrixBirthday || null;          // missing: a museum, nothing more

        const urlPreview = /[?&]anniversary=1/.test(location.search);
        let state = urlPreview ? 'preview' : (B ? B.state() : '');
        // Only someone here for the birthday is sent back when it ends;
        // a visitor to the museum stays as long as they like.
        const cameForBirthday = !!state && !urlPreview;
        const banner = document.getElementById('ogBanner');
        const museumBanner = banner.innerHTML;

        function switchToNew() {
            if (B) B.setPick('new');
            location.href = '/flappycrix';
        }
        function renderBanner() {
            if (!state || !B) { banner.innerHTML = museumBanner; return; }
            const hatDay = B.isHatDay();
            const head = `<b>🎂 HAPPY ${B.ordinal(B.number()).toUpperCase()} BIRTHDAY, FLAPPY CRIX!</b>`;
            let body;
            if (state === 'me') {
                body = 'You switched the birthday month on just for yourself — nobody else sees this.';
            } else if (state === 'preview') {
                body = 'A preview of the birthday month.';
            } else if (state === 'everyone') {
                body = 'The birthday celebration is on early: Flappy Crix is back the way it started on ' +
                       '18 March 2026. Want the new one? Switch whenever you like.';
            } else {
                body = 'All through March, Flappy Crix is back the way it started on 18 March 2026. ' +
                       'Want the new one? Switch whenever you like.';
            }
            const gift = hatDay
                ? '<span class="og-gift">🥳 Today only: play the new Flappy Crix and get a free Golden Party Hat.</span>'
                : '';
            banner.innerHTML = head + body + gift +
                `<br><button type="button" class="og-switch${hatDay ? ' gift' : ''}" id="ogSwitch">` +
                `${hatDay ? '🥳 GET MY HAT — ' : ''}SWITCH TO THE NEW FLAPPY CRIX →</button>`;
            document.getElementById('ogSwitch').onclick = switchToNew;
        }
        renderBanner();

        // The for-everyone setting, read straight from Firestore (the
        // document is public, and REST needs no SDK) and kept in the same
        // local copy the modern game writes.
        async function refreshEveryone() {
            try {
                const cfg = await (await fetch('/api.json', { cache: 'no-store' })).json();
                const fb = cfg && cfg.firebase;
                if (!fb || !fb.projectId) return;
                const r = await fetch('https://firestore.googleapis.com/v1/projects/' +
                    encodeURIComponent(fb.projectId) + '/databases/(default)/documents/config/season' +
                    (fb.apiKey ? '?key=' + encodeURIComponent(fb.apiKey) : ''), { cache: 'no-store' });
                let force = '', at = 0;
                if (r.ok) {
                    const f = (await r.json()).fields || {};
                    force = (f.force && f.force.stringValue) || '';
                    at = +((f.at && (f.at.integerValue || f.at.doubleValue)) || 0);
                } else if (r.status !== 404) {
                    return;                               // unsure: keep what we had
                }
                localStorage.setItem(B.FORCED_KEY, JSON.stringify({ force, at }));
            } catch (e) { /* offline: the local copy stands */ }
        }

        let _wasHatDay = B ? B.isHatDay() : false;
        function check() {
            if (urlPreview || !B) return;
            const now = B.state();
            if (cameForBirthday && !now) {
                // The season is over: back to the game as it is now
                if (B.hop()) location.replace('/flappycrix');
                return;
            }
            // re-draw when it starts, stops or the hat day comes and goes
            const hat = B.isHatDay();
            if (now !== state || hat !== _wasHatDay) { state = now; _wasHatDay = hat; renderBanner(); }
        }
        if (cameForBirthday) {
            refreshEveryone().then(check);
            let ticks = 0;
            setInterval(() => {
                // the clock every 30 seconds, Firestore every minute
                if (++ticks % 2 === 0) refreshEveryone().then(check); else check();
            }, 30000);
        } else if (!urlPreview) {
            // a museum visitor still sees the banner change if the month starts
            setInterval(check, 30000);
        }
        // Another tab (the modern game, the console) changed a setting
        addEventListener('storage', e => {
            if (B && (e.key === B.PREVIEW_KEY || e.key === B.FORCED_KEY)) check();
        });

        // ========== SOUNDS (as the original played them) ==========
        const $ = id => document.getElementById(id);
        const bgMusic = $('bgMusic'), hoverSound = $('hoverSound'), clickSound = $('clickSound'),
              jumpSound = $('jumpSound'), deathSound = $('deathSound'), selectSound = $('selectSound');
        function play(el, vol) {
            try { el.currentTime = 0; el.volume = vol; const p = el.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
        }
        const playHoverSound  = () => play(hoverSound, 0.3);
        const playClickSound  = () => play(clickSound, 0.4);
        const playJumpSound   = () => play(jumpSound, 0.3);
        const playDeathSound  = () => play(deathSound, 0.4);
        const playSelectSound = () => play(selectSound, 0.3);

        // ========== MUSIC CONTROL ==========
        // Browsers refuse music before a tap, so it starts muted and the
        // button turns it on — which is what the original fell back to anyway.
        let musicMuted = true;
        const musicToggle = $('musicToggleBtn');
        bgMusic.volume = 0.3;
        musicToggle.addEventListener('click', () => {
            if (musicMuted) {
                const p = bgMusic.play(); if (p && p.catch) p.catch(() => {});
                musicToggle.textContent = '🔊';
                musicMuted = false;
            } else {
                bgMusic.pause();
                musicToggle.textContent = '🔇';
                musicMuted = true;
            }
            playClickSound();
        });
        musicToggle.addEventListener('mouseenter', playHoverSound);

        // ========== FLAPPY BIRD GAME ==========
        const gameCanvas = $('gameCanvas');
        const gameScore = $('gameScore');
        let gameRunning = false;
        let gameAnimationFrame;

        // Loaded once; the original made a new one on every restart
        const birdImage = new Image();
        birdImage.src = '/img/bird.png';

        class FlappyBird {
            constructor() {
                this.canvas = gameCanvas;
                this.ctx = this.canvas.getContext('2d');
                this.reset();
            }

            reset() {
                this.bird = {
                    x: 100,
                    y: 300,
                    width: 30,
                    height: 30,
                    velocity: 0,
                    gravity: 0.3,
                    jump: -7
                };

                this.pipes = [];
                this.pipeWidth = 50;
                this.pipeGap = 150;
                this.pipeSpacing = 300;
                this.frameCount = 0;
                this.score = 0;
                this.gameOver = false;
                this.birdImage = birdImage;
            }

            draw() {
                // Clear canvas
                this.ctx.fillStyle = '#0A0A0F';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Draw grid
                this.ctx.strokeStyle = 'rgba(255, 70, 85, 0.2)';
                this.ctx.lineWidth = 1;
                for (let i = 0; i < this.canvas.width; i += 50) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(i, 0);
                    this.ctx.lineTo(i, this.canvas.height);
                    this.ctx.stroke();
                }
                for (let i = 0; i < this.canvas.height; i += 50) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(0, i);
                    this.ctx.lineTo(this.canvas.width, i);
                    this.ctx.stroke();
                }

                // Draw pipes
                this.ctx.fillStyle = '#00FF9D';
                this.ctx.shadowColor = '#00FF9D';
                this.ctx.shadowBlur = 10;
                this.pipes.forEach(pipe => {
                    this.ctx.fillRect(pipe.x, 0, this.pipeWidth, pipe.top);
                    this.ctx.fillRect(pipe.x, pipe.bottom, this.pipeWidth, this.canvas.height - pipe.bottom);
                });
                this.ctx.shadowBlur = 0;

                // Draw bird. The whole of /img/bird.png — the same picture the
                // new game uses, black hat included — tilted with the climb and
                // the fall the way the new game tilts it. The hat is near-black
                // and so is this background, so a soft light rim keeps the
                // whole bird visible instead of only its face.
                if (this.birdImage.complete && this.birdImage.naturalWidth) {
                    const c = this.ctx;
                    const tilt = Math.min(Math.max(this.bird.velocity * 0.035, -0.30), 0.40);
                    c.save();
                    c.translate(this.bird.x, this.bird.y);
                    c.rotate(tilt);
                    c.shadowColor = 'rgba(255,255,255,.7)';
                    c.shadowBlur = 5;
                    c.drawImage(this.birdImage, -15, -15, 30, 30);
                    c.restore();
                } else {
                    this.ctx.fillStyle = '#FF6B35';
                    this.ctx.shadowColor = '#FF6B35';
                    this.ctx.shadowBlur = 15;
                    this.ctx.fillRect(this.bird.x - 15, this.bird.y - 15, 30, 30);
                    this.ctx.shadowBlur = 0;
                }

                // Draw score
                this.ctx.fillStyle = '#FF6B35';
                this.ctx.font = '20px "CRIX Pixel", monospace';
                this.ctx.textAlign = 'center';
                this.ctx.fillText(`Score: ${this.score}`, this.canvas.width / 2, 50);

                if (this.gameOver) {
                    this.ctx.fillStyle = '#FF4655';
                    this.ctx.font = '30px "CRIX Pixel", monospace';
                    this.ctx.fillText('GAME OVER', this.canvas.width / 2, this.canvas.height / 2);
                    this.ctx.font = '16px "CRIX Pixel", monospace';
                    this.ctx.fillText('Press START to play again', this.canvas.width / 2, this.canvas.height / 2 + 40);
                }
            }

            die() {
                // Once: the floor and a pipe on the same frame used to play
                // the death sound twice.
                if (this.gameOver) return;
                this.gameOver = true;
                playDeathSound();
            }

            update() {
                if (this.gameOver) return;

                // Bird physics
                this.bird.velocity += this.bird.gravity;
                this.bird.y += this.bird.velocity;

                // Check boundaries
                if (this.bird.y < 0 || this.bird.y > this.canvas.height) {
                    this.die();
                    return;
                }

                // Generate pipes
                if (this.frameCount % 120 === 0) {
                    const topHeight = Math.random() * (this.canvas.height - this.pipeGap - 100) + 50;
                    this.pipes.push({
                        x: this.canvas.width,
                        top: topHeight,
                        bottom: topHeight + this.pipeGap
                    });
                }

                // Update pipes
                for (let i = this.pipes.length - 1; i >= 0; i--) {
                    this.pipes[i].x -= 3;

                    // Check collision
                    if (this.bird.x + 15 > this.pipes[i].x &&
                        this.bird.x - 15 < this.pipes[i].x + this.pipeWidth) {
                        if (this.bird.y - 15 < this.pipes[i].top ||
                            this.bird.y + 15 > this.pipes[i].bottom) {
                            this.die();
                            return;
                        }
                    }

                    // Score
                    if (this.pipes[i].x + this.pipeWidth < this.bird.x && !this.pipes[i].scored) {
                        this.score++;
                        this.pipes[i].scored = true;
                        gameScore.textContent = `Score: ${this.score}`;
                    }

                    // Remove off-screen pipes
                    if (this.pipes[i].x + this.pipeWidth < 0) {
                        this.pipes.splice(i, 1);
                    }
                }

                this.frameCount++;
            }

            jump() {
                if (this.gameOver) return;
                this.bird.velocity = this.bird.jump;
                playJumpSound();
            }
        }

        const game = new FlappyBird();
        game.draw();
        // The first frame is usually drawn before bird.png has arrived, and
        // the start screen is never drawn again — so it sat there showing
        // the orange stand-in square instead of the bird. Redraw once the
        // picture is in.
        if (!(birdImage.complete && birdImage.naturalWidth)) {
            birdImage.addEventListener('load', () => { if (!gameRunning) game.draw(); }, { once: true });
        }
        window.flappyOG = game;      // for poking at in the console

        /* The original stepped once per painted frame. It was tuned on a
           60Hz screen, so it steps 60 times a second whatever the screen
           does, and paints whenever the screen is ready. */
        const STEP = 1000 / 60;
        let last = 0, acc = 0;
        function gameLoop(now) {
            if (!gameRunning) return;
            if (!last) last = now;
            acc += Math.min(250, now - last);
            last = now;
            let n = 0;
            while (acc >= STEP && n < 5) { game.update(); acc -= STEP; n++; }
            if (n >= 5) acc = 0;
            game.draw();
            gameAnimationFrame = requestAnimationFrame(gameLoop);
        }

        function startGame() {
            playSelectSound();
            game.reset();
            gameRunning = true;
            gameScore.textContent = 'Score: 0';
            if (gameAnimationFrame) cancelAnimationFrame(gameAnimationFrame);
            last = 0; acc = 0;
            gameAnimationFrame = requestAnimationFrame(gameLoop);
        }

        function tryJump() {
            if (gameRunning && !game.gameOver) game.jump();
        }

        $('startGameBtn').addEventListener('mouseenter', playHoverSound);
        $('startGameBtn').addEventListener('click', startGame);

        // The original only ever listened for the keyboard
        document.addEventListener('keydown', e => {
            if (e.key === ' ' || e.key === 'Spacebar' || e.code === 'Space' || e.key === 'ArrowUp') {
                e.preventDefault();
                if (!e.repeat) tryJump();
            }
        });
        // One event per tap: pointerdown covers mouse, touch and pen, and
        // fires straight away rather than after the tap is lifted.
        gameCanvas.addEventListener('pointerdown', e => {
            e.preventDefault();
            tryJump();
        });

        // A hidden tab pauses the clock, so coming back does not leap ahead
        document.addEventListener('visibilitychange', () => { last = 0; acc = 0; });

        console.log('🚀 FLAPPY CRIX — THE ORIGINAL (18 March 2026)');
    })();
    </script>
</body>
</html>
